<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <g filter="url(#cardShadow)">
    <rect width="420" height="580" x="20" y="20" rx="24" fill="url(#cardBg)" stroke="#171717" stroke-width="2"/>
    
    <!-- Fine inner border -->
    <rect width="400" height="560" x="30" y="30" rx="18" fill="none" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Top Badge Row -->
    <g transform="translate(50, 60)">
      <circle cx="8" cy="8" r="5" fill="#171717"/>
      <text x="24" y="12" fill="#171717" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" letter-spacing="2">WANIA NAEEM</text>
      <text x="240" y="12" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="10">ID // 2026.01</text>
      <line x1="0" y1="28" x2="360" y2="28" stroke="#E5E5E5" stroke-width="1"/>
    </g>

    <!-- Digital Chip & Security Hologram Pattern -->
    <g transform="translate(50, 110)">
      <!-- Gold/Platinum Hologram Chip (Monochrome) -->
      <rect width="52" height="42" rx="8" fill="#F0F0F0" stroke="#171717" stroke-width="1.5"/>
      <line x1="0" y1="21" x2="52" y2="21" stroke="#171717" stroke-width="1"/>
      <line x1="26" y1="0" x2="26" y2="42" stroke="#171717" stroke-width="1"/>
      <circle cx="26" cy="21" r="7" fill="none" stroke="#171717" stroke-width="1"/>

      <!-- NFC / Signal Waves -->
      <path d="M 80 20 A 12 12 0 0 1 80 40 M 88 14 A 20 20 0 0 1 88 46" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round"/>

      <!-- Role Badge -->
      <rect x="220" y="8" width="140" height="28" rx="14" fill="#171717"/>
      <text x="238" y="26" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" letter-spacing="1">UI/UX DESIGNER</text>
    </g>

    <!-- Center Portrait Silhouette / Monogram Frame -->
    <g transform="translate(50, 175)">
      <rect width="360" height="210" rx="14" fill="#F5F5F7" stroke="#E5E5E5"/>
      <!-- Grid Lines in frame -->
      <line x1="0" y1="105" x2="360" y2="105" stroke="#EAEAEA" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="180" y1="0" x2="180" y2="210" stroke="#EAEAEA" stroke-width="1" stroke-dasharray="4,4"/>
      
      <!-- Minimalist Silhouette -->
      <circle cx="180" cy="85" r="38" fill="#171717"/>
      <path d="M 120 185 C 125 130, 150 120, 180 120 C 210 120, 235 130, 240 185 Z" fill="#171717"/>
      
      <!-- Monogram Tag -->
      <rect x="280" y="16" width="64" height="22" rx="4" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="296" y="31" fill="#171717" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">WN.01</text>
    </g>

    <!-- Bottom Specs & Discipline Pillars -->
    <g transform="translate(50, 410)">
      <text x="0" y="16" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1">CORE DISCIPLINES</text>
      
      <g transform="translate(0, 26)">
        <rect width="112" height="34" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="1"/>
        <text x="14" y="22" fill="#171717" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">Figma System</text>

        <rect x="122" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
        <text x="136" y="22" fill="#555555" font-family="'Poppins', sans-serif" font-size="11" font-weight="500">UI / Wireframes</text>

        <rect x="244" width="116" height="34" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
        <text x="256" y="22" fill="#555555" font-family="'Poppins', sans-serif" font-size="11" font-weight="500">UX Research</text>
      </g>
    </g>

    <!-- Barcode & Stamp at Bottom -->
    <g transform="translate(50, 500)">
      <!-- Barcode lines -->
      <g fill="#171717">
        <rect x="0" y="0" width="3" height="36"/>
        <rect x="6" y="0" width="2" height="36"/>
        <rect x="12" y="0" width="4" height="36"/>
        <rect x="20" y="0" width="1" height="36"/>
        <rect x="24" y="0" width="5" height="36"/>
        <rect x="33" y="0" width="2" height="36"/>
        <rect x="38" y="0" width="3" height="36"/>
        <rect x="44" y="0" width="6" height="36"/>
        <rect x="54" y="0" width="2" height="36"/>
        <rect x="60" y="0" width="4" height="36"/>
        <rect x="68" y="0" width="1" height="36"/>
        <rect x="74" y="0" width="5" height="36"/>
        <rect x="83" y="0" width="3" height="36"/>
        <rect x="90" y="0" width="4" height="36"/>
        <rect x="98" y="0" width="2" height="36"/>
        <rect x="104" y="0" width="6" height="36"/>
        <rect x="114" y="0" width="2" height="36"/>
        <rect x="120" y="0" width="3" height="36"/>
        <rect x="126" y="0" width="1" height="36"/>
        <rect x="132" y="0" width="4" height="36"/>
        <rect x="140" y="0" width="3" height="36"/>
      </g>
      <text x="0" y="48" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="2">0923-2026-WN-SMIU</text>

      <!-- Stamp -->
      <circle cx="330" cy="22" r="22" fill="none" stroke="#171717" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="330" y="20" text-anchor="middle" fill="#171717" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">VERIFIED</text>
      <text x="330" y="30" text-anchor="middle" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="6">PORTFOLIO</text>
    </g>
  </g>
</svg>
