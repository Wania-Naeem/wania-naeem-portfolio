<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%">
  <defs>
    <linearGradient id="portraitBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F2F4"/>
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="540" height="680" rx="16" fill="url(#portraitBg)"/>
  <rect width="538" height="678" x="1" y="1" rx="15" fill="none" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Architectural Register Marks -->
  <g stroke="#C4C4D0" stroke-width="1" opacity="0.6">
    <line x1="28" y1="28" x2="44" y2="28"/>
    <line x1="28" y1="28" x2="28" y2="44"/>
    <line x1="512" y1="28" x2="496" y2="28"/>
    <line x1="512" y1="28" x2="512" y2="44"/>
    <line x1="28" y1="652" x2="44" y2="652"/>
    <line x1="28" y1="652" x2="28" y2="636"/>
    <line x1="512" y1="652" x2="496" y2="652"/>
    <line x1="512" y1="652" x2="512" y2="636"/>
  </g>

  <!-- Editorial Silhouette & Architecture -->
  <g transform="translate(270, 310)">
    <circle cx="0" cy="0" r="140" fill="#EAEAEF" stroke="#E5E5E5" stroke-width="1"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="60" fill="#171717"/>
    <!-- Torso -->
    <path d="M -110 125 C -105 40, -55 25, 0 25 C 55 25, 105 40, 110 125 Z" fill="#171717"/>
  </g>

  <!-- Bottom Details Label -->
  <g transform="translate(270, 560)">
    <text x="0" y="0" text-anchor="middle" fill="#171717" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" letter-spacing="1">WANIA NAEEM</text>
    <text x="0" y="26" text-anchor="middle" fill="#888888" font-family="'Poppins', sans-serif" font-size="12">Software Engineering Student &amp; UI/UX Designer</text>
    <rect x="-90" y="46" width="180" height="26" rx="13" fill="#171717"/>
    <text x="0" y="63" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">SMIU • KARACHI, PK</text>
  </g>
</svg>
